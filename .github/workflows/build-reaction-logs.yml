name: Build Reaction Logs

on:
  push:
    branches: [fix/reaction-logs-history-popup]
    paths:
      - "plugins/reaction-logs/**"
      - "tests/reaction-state.test.ts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/build-reaction-logs.yml"
  pull_request:
    paths:
      - "plugins/reaction-logs/**"
      - "tests/reaction-state.test.ts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/build-reaction-logs.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - uses: oven-sh/setup-bun@v2

      - name: Install JavaScript build dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}

      - name: Run reaction state regression tests
        run: bun test tests/reaction-state.test.ts

      - name: Type-check Reaction Logs
        run: bunx tsc --noEmit --project plugins/reaction-logs/tsconfig.json

      - name: Build Reaction Logs only
        run: gradle --no-daemon packageReactionLogs
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}

      - name: Verify installable ZIP and DEX payload
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          archive = Path("build/dist/lifawaz.reaction-logs@1.3.0.zip")
          assert archive.is_file(), f"Missing build output: {archive}"
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None, "Plugin ZIP integrity check failed"
              names = set(package.namelist())
              assert {"manifest.json", "index.js", "plugin.jar"} <= names, names
              manifest = json.loads(package.read("manifest.json"))
              assert manifest["id"] == "lifawaz.reaction-logs"
              assert manifest["version"] == "1.3.0"
              assert manifest["dist"]["script"] == "index.js"
              assert manifest["dist"]["android"]["path"] == "plugin.jar"
              native = zipfile.ZipFile(package.open("plugin.jar"))
              assert "classes.dex" in native.namelist(), native.namelist()
          print(f"PASS: {archive} is a flat Valenced plugin ZIP with manifest, JavaScript and DEX.")
          PY

      - name: Publish ZIP and update this branch catalog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/fix/reaction-logs-history-popup'
        run: |
          mkdir -p pool
          cp build/dist/lifawaz.reaction-logs@1.3.0.zip pool/lifawaz.reaction-logs@1.3.0.zip
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package = Path("pool/lifawaz.reaction-logs@1.3.0.zip")
          data = package.read_bytes()
          index_path = Path("index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          plugin = index["plugins"]["lifawaz.reaction-logs"]
          dependencies = plugin["versions"]["1.2.9"]["dependencies"]
          plugin["description"] = "Keep a persistent, emoji-specific history of removed users in Discord's reaction popup."
          plugin["channels"]["latest"] = "1.3.0"
          plugin["versions"]["1.3.0"] = {
              "url": "https://raw.githubusercontent.com/LiFawaz/fawaz-plugins/main/pool/lifawaz.reaction-logs%401.3.0.zip",
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
              "dependencies": dependencies,
          }
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("Updated catalog:", plugin["versions"]["1.3.0"])
          PY
          python scripts/validate_repo.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool/lifawaz.reaction-logs@1.3.0.zip index.json
          git diff --cached --quiet || git commit -m "Publish Reaction Logs 1.3.0 package"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "GitHub rejected the push (attempt ${attempt}/5); retrying."
            sleep 4
          done
          echo "Could not publish the package to the feature branch."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: reaction-logs-1.3.0
          path: build/dist/lifawaz.reaction-logs@1.3.0.zip
          if-no-files-found: error
          retention-days: 14
