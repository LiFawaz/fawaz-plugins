name: Build VC Follow

on:
  push:
    branches: [main]
    paths:
      - "plugins/vc-follow/**"
      - ".github/workflows/build-vc-follow.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vc-follow-1-3-9-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build VC Follow
        run: bun --bun run build --plugins-dir plugins vc-follow

      - name: Package and update the repository index
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          import json
          import subprocess

          root = Path(".")
          plugin_dir = root / "plugins/vc-follow"
          manifest = json.loads((plugin_dir / "manifest.json").read_text(encoding="utf-8"))
          plugin_id = manifest["id"]
          version = str(manifest["version"])
          if plugin_id != "com.lifawaz.vc-follow" or version != "1.3.9":
              raise SystemExit("This workflow only publishes VC Follow 1.3.9.")

          built_js = plugin_dir / "build/js/index.js"
          if not built_js.is_file() or not built_js.stat().st_size:
              raise SystemExit("The Valenced build did not produce build/js/index.js.")
          subprocess.run(["node", "--check", str(built_js)], check=True)

          pool = root / "pool"
          pool.mkdir(exist_ok=True)
          archive = pool / f"{plugin_id}@{version}.zip"
          with ZipFile(archive, "w", ZIP_DEFLATED) as package:
              package.write(plugin_dir / "manifest.json", "manifest.json")
              package.write(built_js, "index.js")

          with ZipFile(archive) as package:
              if package.testzip() is not None:
                  raise SystemExit("The generated ZIP failed its integrity check.")
              if set(package.namelist()) != {"manifest.json", "index.js"}:
                  raise SystemExit(f"Unexpected ZIP contents: {package.namelist()}")
              packaged_manifest = json.loads(package.read("manifest.json"))
              if packaged_manifest != manifest:
                  raise SystemExit("The packaged manifest does not match the source manifest.")
              bundled = package.read("index.js")
              temp_js = root / "build-vc-follow-check.js"
              temp_js.write_bytes(bundled)
              subprocess.run(["node", "--check", str(temp_js)], check=True)
              temp_js.unlink()

          data = archive.read_bytes()
          index_path = root / "index.json"
          index = json.loads(index_path.read_text(encoding="utf-8"))
          plugin = index["plugins"][plugin_id]
          plugin["description"] = manifest["description"]
          plugin.setdefault("channels", {})["latest"] = version
          plugin.setdefault("versions", {})[version] = {
              "url": f"https://raw.githubusercontent.com/LiFawaz/fawaz-plugins/main/pool/{archive.name}",
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
              "dependencies": manifest.get("dependencies", {}),
          }
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Built {archive} ({len(data)} bytes)")
          print(f"SHA-256: {hashlib.sha256(data).hexdigest()}")
          PY

      - name: Commit the package and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool/com.lifawaz.vc-follow@1.3.9.zip index.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish VC Follow 1.3.9"
            git push origin main
          fi

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vc-follow-1.3.9-install-zip
          path: pool/com.lifawaz.vc-follow@1.3.9.zip
          if-no-files-found: error
          retention-days: 30
