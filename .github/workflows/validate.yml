name: Validate plugin repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate index, checksums, manifests and ZIP files
        run: python scripts/validate_repo.py
      - name: Check voice downloader JavaScript syntax
        run: node --check plugins/voice-message-downloader/js/index.js
      - name: Test voice downloader settings and save flow
        run: node tests/voice-downloader-smoke.cjs
